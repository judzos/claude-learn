<style>
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --ink:#1f2328; --mute:#667085; --line:#e2dccd;
  --acc:#0f6b62; --acc-soft:#dcefe9; --warn:#b4541a; --warn-soft:#fbe9d9;
  --good:#1f7a3d; --good-soft:#dff3e4; --bad:#b3261e; --bad-soft:#fbe1df;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15181c; --panel:#1d2126; --ink:#e8e6e1; --mute:#9aa3ad; --line:#30363d;
    --acc:#5cc8b8; --acc-soft:#1c3b37; --warn:#f0a064; --warn-soft:#3c2a1c;
    --good:#6fd08a; --good-soft:#1c3a25; --bad:#ff8a80; --bad-soft:#43201e; color-scheme:dark; }
}

  --acc:#5cc8b8; --acc-soft:#1c3b37; --warn:#f0a064; --warn-soft:#3c2a1c;
  --good:#6fd08a; --good-soft:#1c3a25; --bad:#ff8a80; --bad-soft:#43201e; color-scheme:dark; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

nav a.done .dot{background:var(--good);border-color:var(--good);color:#fff}

nav a.on .dot{border-color:currentColor}
.bar{height:6px;background:var(--line);border-radius:3px;margin:14px 8px 4px;overflow:hidden}

section.topic{display:none} section.topic.on{display:block}
.kicker{color:var(--acc);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}

.badge.learned{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.badge.partly{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.badge.new{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.lead{font-size:1.08rem;color:var(--mute);margin-bottom:1.2em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.formula{background:var(--acc-soft);border-radius:12px;padding:10px 18px;margin:14px 0;overflow-x:auto}
.trap{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 10px 10px 0;padding:10px 16px;margin:14px 0}
.trap b:first-child{color:var(--warn)}
.note{border-left:4px solid var(--acc);padding:6px 16px;margin:14px 0;color:var(--mute)}
ol.method{padding-left:1.3em} ol.method li{margin:.35em 0}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--acc)}
button:focus-visible,a:focus-visible,.mn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}

.mcq .opts{display:grid;gap:8px;margin:10px 0}
.mcq .opts button{text-align:left;padding:9px 12px}
.mcq .opts button.right{background:var(--good-soft);border-color:var(--good)}

.why.show{display:block}
.num input{font:inherit;width:140px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.fb{font-weight:600;margin-left:6px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.recall textarea{font:inherit;width:100%;min-height:90px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.recall .self button.sel{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0;padding:0}

.flash .fc.flipped{background:var(--acc-soft);border-color:var(--acc)}
.flash .fc .back{display:none} .flash .fc.flipped .back{display:block} .flash .fc.flipped .front{display:none}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:600;color:var(--acc)}
.prob{margin:16px 0 4px}
.prob .tag{display:inline-block;font-size:.72rem;font-weight:700;background:var(--acc-soft);color:var(--acc);border-radius:20px;padding:1px 9px;margin-right:6px}
.timer .out{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700}
figure{margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
figure img,figure svg{display:block;max-width:100%;height:auto;margin:0 auto}
figcaption{color:var(--mute);font-size:.88rem;margin-top:6px;text-align:center}
table{border-collapse:collapse;width:100%;font-size:.93rem}
.tablewrap{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot a{text-decoration:none}
.grid2,.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile:hover{border-color:var(--acc)}
.tile b{display:block} .tile span{color:var(--mute);font-size:.88rem;display:block}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tile .meta em{font-style:normal;font-size:.72rem;font-weight:700;border-radius:20px;padding:1px 8px;border:1px solid var(--line);color:var(--mute)}
.tile .meta em.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tile .meta em.new{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tile.done{border-color:var(--good)}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.mapwrap{overflow-x:auto}
.mapwrap svg{display:block;margin:0 auto}
.mn{cursor:pointer}
.mn rect{fill:var(--panel);stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 4}
.mn.learned rect{fill:var(--good-soft);stroke:var(--good);stroke-dasharray:none}
.mn.done rect{stroke:var(--acc);stroke-width:2.5;stroke-dasharray:none}
.mn:hover rect{stroke:var(--acc)}
.mn text{fill:var(--ink);font-size:12px;font-family:inherit}
.mn .tick{fill:var(--acc)} .mn .tickmark{fill:none;stroke:var(--bg);stroke-width:2}
.medge{fill:none;stroke:var(--mute);stroke-width:1.3;opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px dashed var(--mute)}
.legend i.l{background:var(--good-soft);border:1.5px solid var(--good)}
.legend i.d{border:2.5px solid var(--acc)}
.mapsum{font-size:.9rem;color:var(--mute);margin:0 0 8px}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
@media (max-width:820px){
  .layout{display:block}
  nav{position:sticky;top:0;height:auto;z-index:5;background:var(--bg);border-right:0;border-bottom:1px solid var(--line);padding:8px 10px}
  nav .brand,nav .sub,.barlabel,.navfoot{display:none} .bar{margin:6px 4px 0}
  nav .links{display:flex;overflow-x:auto;gap:4px} nav a{white-space:nowrap}
  main{padding:22px 16px 80px} .grid2,.tiles{grid-template-columns:1fr}
}
@media print{
  nav,.foot,.btnrow,.navfoot{display:none!important}

}

<body>
<div class="layout">
<nav>
  <div class="brand" id="brand"></div>
  <div class="sub" id="sub"></div>
  <div class="links" id="links"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="barlabel" id="barlabel"></div>
  <div class="navfoot"><button id="theme" type="button"></button></div>
</nav>
<main>
<!--@CONTENT@-->
</main>
</div>
<script>
(function(){
var D={};
try{D=JSON.parse(document.getElementById('guide-data').textContent)||{};}catch(e){console.error('guide-data is not valid JSON');}
var KEY=D.key||('guide:'+document.title);
var st={done:{},right:{},recall:{},theme:null};
try{var saved=JSON.parse(localStorage.getItem(KEY)||'null'); if(saved) for(var k in saved) st[k]=saved[k];}catch(e){}
['done','right','recall'].forEach(function(k){if(!st[k]||typeof st[k]!=='object')st[k]={};});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
var $=function(q,r){return (r||document).querySelector(q)}, $$=function(q,r){return [].slice.call((r||document).querySelectorAll(q))};
function el(tag,cls,text){var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var secs=$$('section.topic'), mods=secs.filter(function(s){return s.id!=='home'});
var nodes=(D.map&&D.map.nodes)||[], edges=(D.map&&D.map.edges)||[];

/* ---------- graph status per module ---------- */
function graphStatus(id){
  var mine=nodes.filter(function(n){return n.module===id}); if(!mine.length)return null;
  var l=mine.filter(function(n){return n.learned}).length;
  return l===mine.length?'learned':l?'partly':'new';
}
var BADGE={learned:'In your knowledge graph: review',partly:'Partly in your knowledge graph',new:'New to you'};

/* ---------- checks: every graded question in a module ---------- */
function checks(sec){return $$('.mcq,.num,.recall',sec);}
function qid(sec,q){return sec.id+':'+checks(sec).indexOf(q);}
function markRight(sec,q){st.right[qid(sec,q)]=1; save(); refresh();}
function rightCount(sec){var n=0; checks(sec).forEach(function(q){if(st.right[qid(sec,q)])n++;}); return n;}

/* ---------- nav, tiles, progress ---------- */
function buildNav(){
  $('#brand').textContent=D.title||document.title; $('#sub').textContent=D.subtitle||'';
  var links=$('#links');
  secs.forEach(function(s){
    var a=el('a'); a.href='#'+s.id; a.dataset.s=s.id;
    if(s.id!=='home')a.appendChild(el('span','dot'));
    a.appendChild(document.createTextNode(s.dataset.title||s.id)); links.appendChild(a);
  });
}
function buildTiles(){
  $$('[data-tiles]').forEach(function(box){
    box.classList.add('tiles');
    mods.forEach(function(s){
      var a=el('a','tile'); a.href='#'+s.id; a.dataset.s=s.id;
      a.appendChild(el('b',null,s.dataset.title||s.id));
      if(s.dataset.blurb)a.appendChild(el('span',null,s.dataset.blurb));
      a.appendChild(el('div','meta'));
      box.appendChild(a);
    });
  });
}
function refresh(){
  var n=0;
  mods.forEach(function(s){
    var d=!!st.done[s.id]; if(d)n++;
    var a=$('#links a[data-s="'+s.id+'"]'); if(a)a.classList.toggle('done',d);
    var b=$('.done-btn[data-s="'+s.id+'"]'); if(b)b.textContent=d?'✓ Done (undo)':'Mark module done';
    $$('.tile[data-s="'+s.id+'"]').forEach(function(t){
      t.classList.toggle('done',d);
      var m=$('.meta',t), c=checks(s).length, r=rightCount(s), g=graphStatus(s.id), h='';
      if(d)h+='<em class="ok">✓ Done</em>';
      if(c)h+='<em'+(r===c?' class="ok"':'')+'>'+r+'/'+c+' checks</em>';
      if(g==='new')h+='<em class="new">New to you</em>'; else if(g==='learned')h+='<em class="ok">In your graph</em>'; else if(g==='partly')h+='<em>Partly in your graph</em>';
      m.innerHTML=h; m.style.display=h?'':'none';
    });
  });
  $('#bar').style.width=(mods.length?100*n/mods.length:0)+'%';
  $('#barlabel').textContent=n+' of '+mods.length+' modules done';
  $$('[data-map]').forEach(drawMap);
}
function route(){
  var id=decodeURIComponent((location.hash||'#home').slice(1));
  var target=document.getElementById(id), sec=target&&(target.matches('section.topic')?target:target.closest('section.topic'));
  if(!sec)sec=$('section#home')||secs[0];
  secs.forEach(function(s){s.classList.toggle('on',s===sec)});
  $$('#links a').forEach(function(a){a.classList.toggle('on',a.dataset.s===sec.id)});
  if(target&&target!==sec)target.scrollIntoView(); else window.scrollTo(0,0);
}

/* ---------- module chrome: badge and footer ---------- */
function initModules(){
  mods.forEach(function(s,i){
    var g=graphStatus(s.id);
    if(g){var b=el('div','badge '+g,BADGE[g]); var k=$('.kicker',s); var anchor=k||$('h2',s);
      if(anchor)anchor.parentNode.insertBefore(b,anchor.nextSibling); else s.insertBefore(b,s.firstChild);}
    var f=el('div','foot');
    var prev=i?mods[i-1]:$('section#home'), next=mods[i+1];
    var pa=el('a'); if(prev){pa.href='#'+prev.id; pa.appendChild(el('button',null,'← '+(prev.dataset.title||prev.id)));} f.appendChild(pa);
    var db=el('button','done-btn'); db.dataset.s=s.id; db.onclick=function(){st.done[s.id]=!st.done[s.id];save();refresh();}; f.appendChild(db);
    var na=el('a'); if(next){na.href='#'+next.id; na.appendChild(el('button','pri',(next.dataset.title||next.id)+' →'));} f.appendChild(na);
    s.appendChild(f);
  });
  var home=$('section#home');
  if(home&&mods[0]&&!$('.foot',home)){var f=el('div','foot'); f.appendChild(el('span')); var a=el('a'); a.href='#'+mods[0].id; a.appendChild(el('button','pri','Start: '+(mods[0].dataset.title||mods[0].id)+' →')); f.appendChild(a); home.appendChild(f);}
}

/* ---------- step-by-step reveals ---------- */
function initSteps(){
  $$('.steps').forEach(function(box){
    var stp=$$('.step',box), shown=1; if(!stp.length)return;
    var row=el('div','btnrow'), nx=el('button','pri'), all=el('button',null,'Show all'), rs=el('button',null,'Hide');
    row.appendChild(nx);row.appendChild(all);row.appendChild(rs);box.appendChild(row);
    function upd(){stp.forEach(function(e,i){e.classList.toggle('hid',i>=shown)});
      nx.style.display=all.style.display=shown<stp.length?'':'none'; rs.style.display=shown>1?'':'none';
      nx.textContent='Next step ('+shown+'/'+stp.length+')';}
    nx.onclick=function(){shown++;upd()}; all.onclick=function(){shown=stp.length;upd()}; rs.onclick=function(){shown=1;upd()};
    upd();
  });
}
function ensureWhy(q){var w=$('.why',q); if(!w){w=el('div','why'); q.appendChild(w);} return w;}

/* ---------- multiple choice (options are shuffled on every load) ---------- */
function initMcq(){
  $$('.mcq').forEach(function(q){
    var sec=q.closest('section.topic'); q.classList.add('card');
    var ul=$('ul,ol',q), ans=+q.dataset.a, why=ensureWhy(q); if(!ul)return;
    var items=$$('li',ul).map(function(li,i){return {li:li,i:i}});
    for(var j=items.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)), t=items[j]; items[j]=items[r]; items[r]=t;}
    var box=el('div','opts'), solved=false;
    items.forEach(function(it){
      var b=el('button'); b.type='button'; while(it.li.firstChild)b.appendChild(it.li.firstChild);
      b.onclick=function(){ $$('button',box).forEach(function(x){x.classList.remove('wrong')});
        if(it.i===ans){b.classList.add('right'); why.classList.add('show'); if(!solved){solved=true; markRight(sec,q);}}
        else b.classList.add('wrong'); };
      box.appendChild(b);
    });
    ul.parentNode.replaceChild(box,ul);
  });
}
/* ---------- numeric answers ---------- */
function parseNum(v){v=String(v).replace(/[$,\s%]/g,'').replace(/−/g,'-');
  var m=/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/.exec(v); if(m)return m[1]/m[2]; return v===''?NaN:Number(v);}
function initNum(){
  $$('.num').forEach(function(q){
    var sec=q.closest('section.topic'); q.classList.add('card');
    var a=parseNum(q.dataset.a), tol=q.dataset.tol!=null?+q.dataset.tol:Math.max(1e-9,Math.abs(a)*1e-3), why=ensureWhy(q), tries=0;
    var inp=$('input',q), btn=$('button',q), fb=$('.fb',q);
    if(!inp){var row=el('div','btnrow'), lab=el('label');
      if(q.dataset.label)lab.appendChild(document.createTextNode(q.dataset.label+' '));
      inp=el('input'); inp.setAttribute('inputmode','decimal'); lab.appendChild(inp);
      if(q.dataset.unit)lab.appendChild(document.createTextNode(' '+q.dataset.unit));
      btn=el('button',null,'Check'); fb=el('span','fb'); row.appendChild(lab); row.appendChild(btn); row.appendChild(fb);
      q.insertBefore(row,why);}
    if(!fb){fb=el('span','fb'); btn.parentNode.insertBefore(fb,btn.nextSibling);}
    var show=el('button',null,'Show answer'); show.style.display='none'; fb.parentNode.insertBefore(show,fb);
    function check(){var v=parseNum(inp.value); if(isNaN(v)){fb.textContent='Enter a number';fb.className='fb no';return;}
      if(Math.abs(v-a)<=tol){fb.textContent='✓ Correct';fb.className='fb ok';why.classList.add('show');markRight(sec,q);}
      else{tries++;fb.textContent='Not yet. Try again';fb.className='fb no'; if(tries>=2)show.style.display='';}}
    btn.onclick=check; inp.onkeydown=function(e){if(e.key==='Enter')check()};
    show.onclick=function(){why.classList.add('show')};
  });
}
/* ---------- free recall: write it, then compare and mark yourself ---------- */
function initRecall(){
  $$('.recall').forEach(function(q){
    var sec=q.closest('section.topic'); q.classList.add('card');
    var why=ensureWhy(q), ta=el('textarea'); ta.placeholder='Write your answer from memory, then compare.';
    var row=el('div','btnrow'), cmp=el('button','pri','Compare with the model answer'); row.appendChild(cmp);
    var self=el('div','btnrow self'); self.style.display='none'; self.appendChild(el('span','qtag','How did you do?'));
    var id=qid(sec,q);
    [['got','Got it'],['partly','Partly'],['missed','Missed it']].forEach(function(o){
      var b=el('button',null,o[1]); b.dataset.v=o[0];
      b.onclick=function(){st.recall[id]=o[0]; if(o[0]==='got')st.right[id]=1; else delete st.right[id]; save(); refresh(); mark();};
      self.appendChild(b);});
    function mark(){$$('button',self).forEach(function(b){b.classList.toggle('sel',st.recall[id]===b.dataset.v)});}
    q.insertBefore(ta,why); q.insertBefore(row,why); q.appendChild(self);
    cmp.onclick=function(){why.classList.add('show'); self.style.display='';};
    if(st.recall[id]){mark();}
  });
}
/* ---------- flashcards: <dl class="flash"><dt>front</dt><dd>back</dd>… ---------- */
function initFlash(){
  $$('dl.flash').forEach(function(dl){
    var grid=el('div','flash'), dts=$$('dt',dl);
    dts.forEach(function(dt){
      var dd=dt.nextElementSibling; if(!dd||dd.tagName!=='DD')return;
      var c=el('button','fc'); c.type='button';
      var f=el('div','front'), b=el('div','back');
      f.appendChild(el('div','side','Term')); var fi=el('div'); while(dt.firstChild)fi.appendChild(dt.firstChild); f.appendChild(fi);
      b.appendChild(el('div','side','Answer')); var bi=el('div'); while(dd.firstChild)bi.appendChild(dd.firstChild); b.appendChild(bi);
      c.appendChild(f); c.appendChild(b); c.onclick=function(){c.classList.toggle('flipped')};

/* ---------- timer: <div class="timer" data-min="90"></div> ---------- */
function initTimers(){
  $$('.timer').forEach(function(box){
    var total=Math.round((+box.dataset.min||60)*60), left=total, id=null;
    box.classList.add('card'); var row=el('div','btnrow'); row.style.margin='0';
    var go=el('button','pri'), rs=el('button',null,'Reset'), out=el('span','out');
    row.appendChild(go); row.appendChild(rs); row.appendChild(out); box.appendChild(row);
    var label='Start '+(+box.dataset.min||60)+'-minute timer';
    function show(){var m=Math.floor(left/60),s=left%60; out.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
    go.textContent=label;
    go.onclick=function(){ if(id){clearInterval(id);id=null;go.textContent='Resume';return;}
      if(left<=0)return; go.textContent='Pause';
      id=setInterval(function(){left--; if(left<=0){left=0;clearInterval(id);id=null;go.textContent='Time is up';} show();},1000);};
    rs.onclick=function(){clearInterval(id);id=null;left=total;go.textContent=label;show();};
    show();
  });
}

/* ---------- progress map: the subject's ideas, layered by prerequisite ---------- */
function wrap(s,max){var w=String(s).split(/\s+/),lines=[''];
  w.forEach(function(x){var cur=lines[lines.length-1]; if((cur+' '+x).trim().length>max&&cur){lines.push(x);}else lines[lines.length-1]=(cur+' '+x).trim();});
  if(lines.length>2){lines=lines.slice(0,2); lines[1]=lines[1].slice(0,max-1)+'…';}
  return lines;}
function drawMap(box){
  if(!nodes.length){box.style.display='none';return;}
  var by={}; nodes.forEach(function(n){by[n.id]=n});
  var E=edges.filter(function(e){return by[e[0]]&&by[e[1]]&&e[0]!==e[1]});
  var lay={}; nodes.forEach(function(n){lay[n.id]=0});
  for(var it=0;it<nodes.length;it++){var ch=false;
    E.forEach(function(e){if(lay[e[1]]<lay[e[0]]+1&&lay[e[0]]+1<nodes.length){lay[e[1]]=lay[e[0]]+1;ch=true;}}); if(!ch)break;}
  /* a root sits just above the first idea it feeds, not up at the top */
  nodes.forEach(function(n){
    if(E.some(function(e){return e[1]===n.id}))return;
    var kids=E.filter(function(e){return e[0]===n.id}).map(function(e){return lay[e[1]]});
    if(kids.length)lay[n.id]=Math.max(0,Math.min.apply(null,kids)-1);});
  var rows=[]; nodes.forEach(function(n){(rows[lay[n.id]]=rows[lay[n.id]]||[]).push(n)}); rows=rows.filter(Boolean);
  var W=168,H=46,GX=16,GY=42,P=8,PX=30, cols=Math.max.apply(null,rows.map(function(r){return r.length}));
  var width=cols*(W+GX)-GX+2*PX, height=rows.length*(H+GY)-GY+2*P, pos={}, rowOf={};
  rows.forEach(function(r,ri){var rw=r.length*(W+GX)-GX, x0=(width-rw)/2;
    r.forEach(function(n,ci){pos[n.id]={x:x0+ci*(W+GX),y:P+ri*(H+GY)}; rowOf[n.id]=ri;});});
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Map of the ideas in this guide">';
  /* spread each box's edge anchors, ordered by where the other end sits, so edges don't stack */
  var outs={}, ins={};
  E.forEach(function(e){(outs[e[0]]=outs[e[0]]||[]).push(e); (ins[e[1]]=ins[e[1]]||[]).push(e);});
  function anchor(list,e,other){list.sort(function(p,q){return pos[p[other]].x-pos[q[other]].x}); var i=list.indexOf(e), n=list.length;
    return n===1?W/2:W*0.2+(W*0.6)*i/(n-1);}
  var lanes={l:0,r:0};
  E.forEach(function(e){var a=pos[e[0]],b=pos[e[1]], x1=a.x+anchor(outs[e[0]],e,1),y1=a.y+H,x2=b.x+anchor(ins[e[1]],e,0),y2=b.y, my=(y1+y2)/2;
    var r0=rowOf[e[0]], r1=rowOf[e[1]];
    if(r1-r0<2){svg+='<path class="medge" d="M'+x1+' '+y1+' C'+x1+' '+my+' '+x2+' '+my+' '+x2+' '+(y2-2)+'"/>'; return;}
    /* skips a row: go round the boxes in between, on whichever side is nearer */
    var lo=Infinity, hi=-Infinity;
    for(var ri=r0+1;ri<r1;ri++)rows[ri].forEach(function(n){lo=Math.min(lo,pos[n.id].x); hi=Math.max(hi,pos[n.id].x+W);});
    var mid=(x1+x2)/2, left=mid-lo<hi-mid, lane=left?lanes.l++:lanes.r++;
    var sx=left?lo-10-lane*7:hi+10+lane*7, ya=P+(r0+1)*(H+GY)-GY/2+lane*4, yb=P+(r1-1)*(H+GY)+H+GY/2-lane*4;
    svg+='<path class="medge" d="M'+x1+' '+y1+' Q'+x1+' '+ya+' '+sx+' '+ya+' L'+sx+' '+yb+' Q'+x2+' '+yb+' '+x2+' '+(y2-2)+'"/>';});
  var learned=0, done=0;
  nodes.forEach(function(n){var p=pos[n.id], d=!!(n.module&&st.done[n.module]); if(n.learned)learned++; if(d)done++;
    var cls='mn'+(n.learned?' learned':' new')+(d?' done':''), lines=wrap(n.label||n.id,22);
    svg+='<g class="'+cls+'" tabindex="0" data-m="'+esc(n.module||'')+'"><title>'+esc((n.label||n.id)+(n.note?' — '+n.note:'')+(n.learned?' (in your knowledge graph)':' (new to you)'))+'</title>';
    svg+='<rect x="'+p.x+'" y="'+p.y+'" width="'+W+'" height="'+H+'" rx="10"/>';
    var ty=p.y+H/2+(lines.length===1?4:-3);
    lines.forEach(function(l,i){svg+='<text x="'+(p.x+W/2)+'" y="'+(ty+i*14)+'" text-anchor="middle">'+esc(l)+'</text>';});
    if(d)svg+='<circle class="tick" cx="'+(p.x+W-4)+'" cy="'+(p.y+4)+'" r="8"/><path class="tickmark" d="M'+(p.x+W-8)+' '+(p.y+4)+' l3 3 l5 -6"/>';
    svg+='</g>';});
  svg+='</svg>';
  box.classList.add('mapbox');
  box.innerHTML='<p class="mapsum">'+learned+' of '+nodes.length+' ideas are already in your knowledge graph · '+done+' checked off here</p><div class="mapwrap">'+svg+'</div>'+
    '<div class="legend"><span><i class="l"></i>In your knowledge graph</span><span><i></i>New to you</span><span><i class="d"></i>Module done here</span><span>Arrows run from an idea to what builds on it. Click one to open its module.</span></div>';
  $$('.mn',box).forEach(function(g){var m=g.dataset.m; if(!m||!document.getElementById(m))return;
    g.onclick=function(){location.hash='#'+m}; g.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();location.hash='#'+m;}};});
}
